<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Log - SecureAccess Chain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">&#128274; SecureAccess</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="identities.html">Identities</a>
            <a href="access-control.html">Access Control</a>
            <a href="assets.html">Assets</a>
            <a href="audit.html" class="active">Audit</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </div>
    <div class="main-content">
        <header class="topbar">
            <h1>Audit Log</h1>
            <div class="user-info">User</div>
        </header>
        <div class="content">
            <div class="card mb-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h3>Chain Verification</h3>
                        <p class="text-sm">Verify the integrity of the audit blockchain.</p>
                    </div>
                    <button class="btn btn-warning" id="btn-verify">Verify Chain</button>
                </div>
                <div id="verify-result" class="mt-4"></div>
            </div>

            <div class="card">
                <h3>Audit Logs</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Block #</th>
                            <th>Timestamp</th>
                            <th>Event Type</th>
                            <th>Details</th>
                            <th>Hash</th>
                        </tr>
                    </thead>
                    <tbody id="audit-tbody">
                        <tr><td colspan="5">Loading logs...</td></tr>
                    </tbody>
                </table>
                <div class="pagination mt-4 flex gap-2">
                    <button class="btn btn-outline" id="prev-page" disabled>Previous</button>
                    <button class="btn btn-outline" id="next-page" disabled>Next</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
</body>
</html>
