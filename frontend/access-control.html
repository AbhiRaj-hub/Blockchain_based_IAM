<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Control - SecureAccess Chain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">&#128274; SecureAccess</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="identities.html">Identities</a>
            <a href="access-control.html" class="active">Access Control</a>
            <a href="assets.html">Assets</a>
            <a href="audit.html">Audit</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </div>
    <div class="main-content">
        <header class="topbar">
            <h1>Access Control</h1>
            <div class="user-info">User</div>
        </header>
        <div class="content">
            <div class="tabs">
                <button class="tab-btn active" data-tab="policies">Policies</button>
                <button class="tab-btn" data-tab="grants">Access Grants</button>
                <button class="tab-btn" data-tab="check">Access Check</button>
            </div>
            
            <div id="policies-tab" class="tab-content active">
                <div class="card">
                    <div class="toolbar">
                        <h3>Policies</h3>
                        <button class="btn btn-primary" id="btn-add-policy">Create Policy</button>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Resource</th>
                                <th>Action</th>
                                <th>Effect</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="policies-tbody">
                            <tr><td colspan="5">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="grants-tab" class="tab-content" style="display:none;">
                <div class="card">
                    <div class="toolbar">
                        <h3>Access Grants</h3>
                        <button class="btn btn-success" id="btn-add-grant">Grant Access</button>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Identity</th>
                                <th>Policy</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="grants-tbody">
                            <tr><td colspan="4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="check-tab" class="tab-content" style="display:none;">
                <div class="card">
                    <h3>Check Access</h3>
                    <form id="check-access-form">
                        <div class="form-group">
                            <label>Identity (DID)</label>
                            <input type="text" id="check-did" required>
                        </div>
                        <div class="form-group">
                            <label>Resource</label>
                            <input type="text" id="check-resource" required>
                        </div>
                        <div class="form-group">
                            <label>Action</label>
                            <input type="text" id="check-action" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Check Access</button>
                    </form>
                    <div id="check-result" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/access-control.js"></script>
</body>
</html>
