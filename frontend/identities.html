<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identities - SecureAccess Chain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">&#128274; SecureAccess</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="identities.html" class="active">Identities</a>
            <a href="access-control.html">Access Control</a>
            <a href="assets.html">Assets</a>
            <a href="audit.html">Audit</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </div>
    <div class="main-content">
        <header class="topbar">
            <h1>Identities</h1>
            <div class="user-info">User</div>
        </header>
        <div class="content">
            <div class="card">
                <div class="toolbar">
                    <input type="text" id="search-identities" placeholder="Search identities...">
                    <button class="btn btn-primary" id="btn-add-identity">Add Identity</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>DID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="identities-tbody">
                        <tr><td colspan="6">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="identity-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Identity</h2>
            <form id="identity-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="id-username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="id-email" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="id-role">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                        <option value="auditor">Auditor</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="btn-close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/identities.js"></script>
</body>
</html>
